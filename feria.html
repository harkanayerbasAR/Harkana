<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1F1A15">
<meta name="robots" content="noindex">
<title>Harkana · Venta en feria</title>
<style>
/* Pantalla de venta para el stand: blanco y negro con mucho contraste para leer al sol, botones grandes para el pulgar. */
:root{--ink:#14110E;--paper:#FFFFFF;--soft:#F1ECE4;--kraft:#C9965A;--ok:#1C6B34;--warn:#9A5B00;--bad:#A3261A;
--f:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.3;-webkit-user-select:none;user-select:none}
.app{max-width:520px;margin:0 auto;padding:10px 12px 28px;display:flex;flex-direction:column;gap:12px}
button{font-family:var(--f);color:var(--ink);cursor:pointer}
button:focus-visible{outline:4px solid var(--kraft);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:4px solid var(--ink);padding-bottom:8px}
.marca{font-weight:900;letter-spacing:.12em;font-size:1.05rem}
.marca small{display:block;letter-spacing:0;font-weight:700;font-size:.85rem}
.pill{font-weight:800;font-size:.85rem;border:3px solid currentColor;border-radius:99px;padding:5px 10px;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.pend{color:var(--warn)}
.hoy{display:flex;justify-content:space-between;font-weight:800;font-size:1rem}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:14px 8px 12px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.p b{font-size:2.3rem;font-weight:900;line-height:1}
.p span{font-size:1.15rem;font-weight:800}
.p:active{transform:scale(.97);background:var(--soft)}
.p i{position:absolute;top:-12px;right:-8px;min-width:42px;height:42px;padding:0 8px;border-radius:21px;background:var(--ink);color:#fff;font:900 1.4rem/42px var(--f);font-style:normal;text-align:center}
.p i:empty{display:none}
.cart{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px}
.cart .tot{font-size:2.4rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.cart .det{font-size:.95rem;font-weight:700;margin-top:3px;min-height:1.2em}
.chico{border:3px solid var(--ink);background:var(--paper);border-radius:10px;font-weight:800;font-size:1rem;padding:10px 12px}
.pagos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pg{border:4px solid var(--ink);background:var(--paper);border-radius:12px;font-weight:900;font-size:1.02rem;padding:14px 4px;min-height:62px;line-height:1.1}
.pg[aria-pressed="true"]{background:var(--ink);color:#fff}
.vendido{border:0;border-radius:16px;background:var(--ink);color:#fff;font-weight:900;font-size:2.1rem;letter-spacing:.06em;padding:22px 10px}
.vendido:active{transform:scale(.98)}
.msg{font-weight:800;color:var(--bad);text-align:center;min-height:1.3em;margin:-4px 0}
.cons{display:flex;align-items:center;gap:10px}
.cons .mas{flex:1;border:4px solid var(--ink);background:var(--paper);border-radius:14px;font-weight:900;font-size:1.35rem;padding:14px 8px}
.cons .n{font-size:2rem;font-weight:900;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.cons .menos{width:52px;height:52px;border:3px solid var(--ink);background:var(--paper);border-radius:12px;font-weight:900;font-size:1.6rem}
.pie{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pie button{border:3px solid var(--ink);background:var(--paper);border-radius:12px;font-weight:800;font-size:1rem;padding:14px 6px}
.cerrarDia{margin-top:34px;align-self:center;font-size:.85rem;font-weight:600;color:#6b625a}
.link{background:none;border:0;font-weight:800;text-decoration:underline;font-size:1rem;padding:6px}
/* Pantallas que tapan todo: QR de la venta, cierre del día, clave */
.capa{position:fixed;inset:0;background:var(--paper);z-index:10;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:16px 14px 24px;gap:12px;text-align:center}
.capa[hidden]{display:none}
.capa h2{margin:0;font-size:1.7rem;font-weight:900}
.qr{width:min(84vw,430px);background:#fff;padding:8px}
.qr svg{display:block;width:100%;height:auto}
.leyenda{font-size:1.45rem;font-weight:900;margin:0;text-wrap:balance}
.dato{font-size:1.1rem;font-weight:800;margin:0}
.grande{width:min(100%,460px);border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:900;font-size:1.4rem;padding:18px}
.sec{width:min(100%,460px);border:3px solid var(--ink);background:var(--paper);border-radius:14px;font-weight:800;font-size:1.1rem;padding:14px}
.res{width:min(100%,460px);text-align:left;border-collapse:collapse;font-size:1.08rem}
.res td{padding:7px 4px;border-bottom:2px solid var(--soft)}
.res td:last-child{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.res tr.t td{border-top:3px solid var(--ink);font-size:1.25rem}
.res th{text-align:left;padding:14px 4px 4px;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.nota{font-size:.98rem;font-weight:700;max-width:460px;margin:0}
input.clave{width:min(100%,360px);font:800 1.4rem var(--f);border:4px solid var(--ink);border-radius:12px;padding:14px;text-align:center}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="marca">HARKANA<small id="evento">Feria</small></div>
    <span class="pill ok" id="estado" role="status">Todo subido</span>
  </div>
  <div class="hoy"><span id="hoyV">0 ventas</span><span id="hoyT">$0</span></div>

  <div class="prod" id="prod"></div>

  <div class="cart">
    <div><div class="tot" id="tot">$0</div><div class="det" id="det">Tocá los paquetes</div></div>
    <button class="chico" id="limpiar" type="button">Borrar</button>
  </div>

  <div class="pagos" id="pagos" role="group" aria-label="Forma de pago">
    <button class="pg" type="button" data-p="efectivo" aria-pressed="false">Efectivo</button>
    <button class="pg" type="button" data-p="transferencia" aria-pressed="false">Transfe&shy;rencia</button>
    <button class="pg" type="button" data-p="mercadopago" aria-pressed="false">Mercado Pago</button>
  </div>

  <button class="vendido" id="vendido" type="button">VENDIDO</button>
  <div class="msg" id="msg" role="alert"></div>

  <div class="cons">
    <button class="mas" id="consMas" type="button">+1 consulta</button>
    <span class="n" id="consN" aria-label="Consultas">0</span>
    <button class="menos" id="consMenos" type="button" aria-label="Restar una consulta">−</button>
  </div>

  <div class="pie">
    <button type="button" id="anular">Anular última venta</button>
    <button type="button" id="verQR" hidden>Ver QR de la última</button>
  </div>
  <button class="link cerrarDia" id="cerrar" type="button">Cerrar día</button>
</div>

<!-- QR de la venta -->
<div class="capa" id="capaQR" hidden>
  <h2 id="qrTit">Venta N.º 1</h2>
  <p class="dato" id="qrDato"></p>
  <div class="qr" id="qrBox"></div>
  <p class="leyenda">Escaneá con la cámara y participá del sorteo</p>
  <button class="grande" id="qrListo" type="button">Siguiente venta</button>
</div>

<!-- Cierre del día -->
<div class="capa" id="capaRes" hidden>
  <h2 id="resTit">Cierre del día</h2>
  <p class="nota" id="resNota"></p>
  <table class="res" id="resTabla"></table>
  <button class="grande" id="resOk" type="button">Confirmar y cargar al sistema</button>
  <button class="sec" id="resVolver" type="button">Volver a vender</button>
</div>

<!-- Clave de cierre: se pide cada vez que se cierra el día -->
<div class="capa" id="capaCierre" hidden>
  <h2>Cerrar el día</h2>
  <p class="nota">Escribí la clave de cierre.</p>
  <input class="clave" id="claveCierre" type="password" autocomplete="off" aria-label="Clave de cierre">
  <button class="grande" id="cierreOk" type="button">Ver el cierre</button>
  <button class="sec" id="cierreNo" type="button">Volver a vender</button>
  <p class="msg" id="cierreMsg"></p>
</div>

<!-- Clave (una sola vez por celular) -->
<div class="capa" id="capaClave" hidden>
  <h2>Clave del panel</h2>
  <p class="nota">La misma con la que entrás al panel de pedidos. Se pide una sola vez en este celular.</p>
  <input class="clave" id="clave" type="password" autocomplete="current-password" aria-label="Clave">
  <button class="grande" id="claveOk" type="button">Entrar</button>
  <p class="msg" id="claveMsg"></p>
</div>

<script>
(function(){
  "use strict";
  var API="https://script.google.com/macros/s/AKfycbxsephoJR9xpN11_GrSo15Esxfweiw-aocfFsQXGKjnmzY7LLUZIUtTSXNuac5fCTJiqA/exec";
  var WEB="https://harkana.com.ar/compra";
  var qs=new URLSearchParams(location.search);
  var ORIGEN=(qs.get("o")||"abriles").replace(/[^a-z0-9-]/gi,"").slice(0,30)||"abriles";
  var NOMBRE=(qs.get("n")||"Feria Abriles").slice(0,60);
  var LUGAR=(qs.get("l")||"Las Higueras").slice(0,40);
  var PRES=[{k:"q250",n:"¼",u:"kg",p:3900,kg:.25},{k:"q500",n:"½",u:"kg",p:5500,kg:.5},{k:"q1",n:"1",u:"kg",p:8000,kg:1},{k:"q3",n:"3",u:"kg",p:23000,kg:3}];
  var PAGOS={efectivo:"Efectivo",transferencia:"Transferencia",mercadopago:"Mercado Pago"};
  var KEY="hk_feria_"+ORIGEN;
  var $=function(id){return document.getElementById(id);};
  var plata=function(n){return "$"+Math.round(n).toLocaleString("es-AR");};

  /* ---------- guardado en el celular (funciona sin señal) ---------- */
  var leer=function(k){try{return localStorage.getItem(k);}catch(e){return null;}};
  var escribir=function(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}};
  var est;
  try{est=JSON.parse(leer(KEY)||"null");}catch(e){est=null;}
  if(!est||!Array.isArray(est.ventas)) est={ventas:[],consultas:0,consSync:true,n:0};
  function persistir(){ if(!escribir(KEY,JSON.stringify(est))) $("msg").textContent="Ojo: el celular no deja guardar. No cierres esta pestaña."; }
  var clave=leer("hk_feria_clave")||"";

  $("evento").textContent=NOMBRE;
  document.title="Harkana · "+NOMBRE;

  /* ---------- carrito ---------- */
  var cart={q250:0,q500:0,q1:0,q3:0}, pago="";
  PRES.forEach(function(x){
    var b=document.createElement("button"); b.type="button"; b.className="p"; b.id="b-"+x.k;
    b.setAttribute("aria-label","Sumar "+x.n+" "+x.u);
    b.innerHTML='<b>'+x.n+(x.u==="kg"?' <small style="font-size:1.2rem">kg</small>':'')+'</b><span>'+plata(x.p)+'</span><i></i>';
    b.onclick=function(){cart[x.k]=Math.min(99,cart[x.k]+1);pintarCart();vibrar(15);};
    $("prod").appendChild(b);
  });
  function total(c){return PRES.reduce(function(s,x){return s+(c[x.k]||0)*x.p;},0);}
  function detalle(c){return PRES.filter(function(x){return c[x.k]>0;}).map(function(x){return c[x.k]+" × "+x.n+" kg";}).join(" · ");}
  function pintarCart(){
    PRES.forEach(function(x){ $("b-"+x.k).querySelector("i").textContent=cart[x.k]||""; });
    $("tot").textContent=plata(total(cart));
    $("det").textContent=detalle(cart)||"Tocá los paquetes";
    $("msg").textContent="";
  }
  $("limpiar").onclick=function(){cart={q250:0,q500:0,q1:0,q3:0};pintarCart();};
  Array.prototype.forEach.call(document.querySelectorAll(".pg"),function(b){
    b.onclick=function(){pago=b.dataset.p;Array.prototype.forEach.call(document.querySelectorAll(".pg"),function(o){o.setAttribute("aria-pressed",String(o===b));});$("msg").textContent="";};
  });
  function vibrar(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

  /* ---------- venta ---------- */
  function nuevoId(){
    var abc="ABCDEFGHJKMNPQRSTUVWXYZ23456789",s,usados={};
    est.ventas.forEach(function(v){usados[v.id]=1;});
    do{s="";for(var i=0;i<7;i++)s+=abc.charAt(Math.floor(Math.random()*abc.length));}while(usados[s]);
    return s;
  }
  $("vendido").onclick=function(){
    if(total(cart)<=0){$("msg").textContent="Tocá al menos un paquete.";vibrar(200);return;}
    if(!pago){$("msg").textContent="Elegí cómo pagó.";vibrar(200);return;}
    est.n=(est.n||0)+1;
    var v={id:nuevoId(),n:est.n,t:Date.now(),q250:cart.q250,q500:cart.q500,q1:cart.q1,q3:cart.q3,total:total(cart),pago:pago,sync:false,anulada:false};
    est.ventas.push(v); persistir();
    cart={q250:0,q500:0,q1:0,q3:0}; pago="";
    Array.prototype.forEach.call(document.querySelectorAll(".pg"),function(o){o.setAttribute("aria-pressed","false");});
    pintarCart(); pintarHoy(); mostrarQR(v); vibrar([30,40,30]); subir();
  };
  function mostrarQR(v){
    var q=qrcode(0,"M"); q.addData(WEB+"?v="+v.id+"&o="+ORIGEN); q.make();
    $("qrBox").innerHTML=q.createSvgTag({cellSize:4,margin:4,scalable:true});
    $("qrTit").textContent="Venta N.º "+v.n;
    $("qrDato").textContent=plata(v.total)+" · "+PAGOS[v.pago]+" · "+detalle(v);
    $("capaQR").hidden=false; window.scrollTo(0,0);
  }
  $("qrListo").onclick=function(){$("capaQR").hidden=true;};
  $("verQR").onclick=function(){var u=ultima();if(u)mostrarQR(u);};
  function ultima(){for(var i=est.ventas.length-1;i>=0;i--)if(!est.ventas[i].anulada)return est.ventas[i];return null;}
  $("anular").onclick=function(){
    var u=ultima(); if(!u){$("msg").textContent="No hay ventas para anular.";return;}
    if(!confirm("¿Anular la venta N.º "+u.n+" ("+plata(u.total)+", "+detalle(u)+")?"))return;
    u.anulada=true; u.sync=false; persistir(); pintarHoy(); subir();
  };

  /* ---------- consultas ---------- */
  $("consMas").onclick=function(){est.consultas++;est.consSync=false;persistir();pintarHoy();vibrar(15);};
  $("consMenos").onclick=function(){if(est.consultas>0){est.consultas--;est.consSync=false;persistir();pintarHoy();}};

  function validas(){return est.ventas.filter(function(v){return !v.anulada;});}
  function pintarHoy(){
    var vs=validas();
    $("hoyV").textContent=vs.length+(vs.length===1?" venta":" ventas");
    $("hoyT").textContent=plata(vs.reduce(function(s,v){return s+v.total;},0));
    $("consN").textContent=est.consultas;
    $("verQR").hidden=!ultima();
    var pend=est.ventas.filter(function(v){return !v.sync;}).length+(est.consSync?0:1);
    var e=$("estado");
    if(!pend){e.className="pill ok";e.textContent="Todo subido";}
    else{e.className="pill pend";e.textContent=(navigator.onLine===false?"Sin señal · ":"")+"Falta subir "+est.ventas.filter(function(v){return !v.sync;}).length;}
  }

  /* ---------- subir a la planilla cuando hay señal ---------- */
  function api(cuerpo){
    var ctl=window.AbortController?new AbortController():null, t=setTimeout(function(){ctl&&ctl.abort();},20000);
    return fetch(API,{method:"POST",body:JSON.stringify(cuerpo),signal:ctl?ctl.signal:undefined})
      .then(function(r){clearTimeout(t);return r.json();},function(e){clearTimeout(t);throw e;});
  }
  function paraSubir(){
    return est.ventas.filter(function(v){return !v.sync;}).map(function(v){
      return {id:v.id,n:v.n,t:v.t,q250:v.q250,q500:v.q500,q1:v.q1,q3:v.q3,pago:v.pago,anulada:v.anulada};
    });
  }
  var subiendo=false;
  function subir(){
    if(subiendo||!clave)return Promise.resolve(false);
    var lote=paraSubir(); if(!lote.length&&est.consSync){pintarHoy();return Promise.resolve(true);}
    subiendo=true;
    return api({accion:"feriaVentas",clave:clave,origen:ORIGEN,ventas:lote,consultas:est.consultas}).then(function(d){
      subiendo=false;
      if(d&&d.error==="clave"){pedirClave("La clave no es correcta.");return false;}
      if(!d||!d.ok)return false;
      var ok={};(d.subidas||[]).forEach(function(id){ok[id]=1;});
      est.ventas.forEach(function(v){ if(ok[v.id]&&lote.some(function(l){return l.id===v.id&&l.anulada===v.anulada;})) v.sync=true; });
      est.consSync=true; persistir(); pintarHoy(); return true;
    }).catch(function(){subiendo=false;pintarHoy();return false;});
  }
  window.addEventListener("online",subir);
  window.addEventListener("offline",pintarHoy);
  setInterval(subir,30000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){subir();pedirPantalla();}});

  /* ---------- clave ---------- */
  function pedirClave(m){ $("claveMsg").textContent=m||""; $("capaClave").hidden=false; setTimeout(function(){$("clave").focus();},50); }
  $("claveOk").onclick=function(){
    var c=$("clave").value.trim(); if(!c){$("claveMsg").textContent="Escribí la clave.";return;}
    $("claveMsg").textContent="Revisando…";
    api({accion:"feriaVentas",clave:c,origen:ORIGEN,ventas:[]}).then(function(d){
      if(d&&d.ok){clave=c;escribir("hk_feria_clave",c);$("capaClave").hidden=true;subir();}
      else $("claveMsg").textContent=d&&d.error==="clave"?"Clave incorrecta.":"No se pudo revisar. Probá de nuevo.";
    }).catch(function(){
      /* Sin señal: se guarda igual y se revisa cuando vuelva la conexión. */
      clave=c;escribir("hk_feria_clave",c);$("capaClave").hidden=true;
    });
  };

  /* ---------- cierre del día ---------- */
  function filasLocales(){
    var vs=validas(), q={q250:0,q500:0,q1:0,q3:0}, kg=0, pg={efectivo:0,transferencia:0,mercadopago:0}, t=0;
    vs.forEach(function(v){PRES.forEach(function(x){q[x.k]+=v[x.k];kg+=v[x.k]*x.kg;});pg[v.pago]+=v.total;t+=v.total;});
    return {ventas:vs.length,q250:q.q250,q500:q.q500,q1:q.q1,q3:q.q3,kg:kg,total:t,pagos:pg,consultas:est.consultas};
  }
  function tabla(r,completo){
    var h="<tr><th colspan=2>Paquetes</th></tr>";
    PRES.forEach(function(x){h+="<tr><td>"+x.n+" kg</td><td>"+r[x.k]+"</td></tr>";});
    h+="<tr class=t><td>Total kilos</td><td>"+(Math.round(r.kg*100)/100).toLocaleString("es-AR")+" kg</td></tr>";
    h+="<tr><th colspan=2>Plata</th></tr>";
    Object.keys(PAGOS).forEach(function(k){h+="<tr><td>"+PAGOS[k]+"</td><td>"+plata(r.pagos[k]||0)+"</td></tr>";});
    h+="<tr class=t><td>Total ("+r.ventas+" ventas)</td><td>"+plata(r.total)+"</td></tr>";
    h+="<tr><th colspan=2>Gente</th></tr>";
    if(completo){
      h+="<tr><td>Muestras entregadas</td><td>"+r.muestras+"</td></tr>";
      h+="<tr><td>Compradores con datos</td><td>"+r.conDatos+"</td></tr>";
      h+="<tr><td>Compradores sin datos</td><td>"+r.sinDatos+"</td></tr>";
      h+="<tr><td>Probaron la muestra y compraron</td><td>"+r.volvieron+"</td></tr>";
    }
    h+="<tr><td>Consultas</td><td>"+r.consultas+"</td></tr>";
    if(completo) h+="<tr><td>Quieren revender</td><td>"+r.revendedores+"</td></tr>";
    return h;
  }
  var resumen=null, claveCierre="";
  /* Cerrar el día pide una clave aparte cada vez, para que nadie lo toque sin querer. */
  $("cerrar").onclick=function(){ $("claveCierre").value=""; $("cierreMsg").textContent=""; $("capaCierre").hidden=false; setTimeout(function(){$("claveCierre").focus();},50); };
  $("cierreNo").onclick=function(){ $("capaCierre").hidden=true; };
  $("cierreOk").onclick=function(){
    var c=$("claveCierre").value.trim(); if(!c){$("cierreMsg").textContent="Escribí la clave de cierre.";return;}
    claveCierre=c; $("capaCierre").hidden=true; abrirCierre();
  };
  function abrirCierre(){
    $("resTit").textContent="Cierre · "+NOMBRE; $("resOk").hidden=true; $("resOk").disabled=false;
    $("resTabla").innerHTML=tabla(filasLocales(),false);
    $("resNota").textContent="Buscando muestras y compradores…";
    $("capaRes").hidden=false; window.scrollTo(0,0);
    if(!clave){pedirClave();return;}
    subir().then(function(){
      return api({accion:"feriaResumen",clave:clave,claveCierre:claveCierre,origen:ORIGEN,consultas:est.consultas});
    }).then(function(d){
      if(d&&d.error==="clave_cierre"){ $("capaRes").hidden=true; $("cierreMsg").textContent="Clave de cierre incorrecta."; $("claveCierre").value=""; $("capaCierre").hidden=false; return; }
      if(!d||!d.ok)throw new Error("x");
      resumen=d; $("resTabla").innerHTML=tabla(d,true);
      var falta=est.ventas.filter(function(v){return !v.sync;}).length;
      $("resNota").textContent=(falta?"Atención: quedan "+falta+" ventas sin subir; esperá un momento y volvé a abrir el cierre. ":"")+
        (d.cerrado?"Este día ya se cargó una vez. Si confirmás de nuevo, se actualiza con todo lo vendido.":"Al confirmar se carga un pedido “"+NOMBRE+"” entregado y se descuenta el stock.");
      $("resOk").hidden=d.kg<=0;
    }).catch(function(){
      $("resNota").textContent="Sin señal: esto es lo que hay en el celular. Para cargarlo al sistema necesitás conexión; las ventas quedan guardadas igual.";
    });
  }
  $("resVolver").onclick=function(){$("capaRes").hidden=true; claveCierre="";};
  $("resOk").onclick=function(){
    $("resOk").disabled=true; $("resOk").textContent="Cargando…";
    api({accion:"feriaCerrar",clave:clave,claveCierre:claveCierre,origen:ORIGEN,nombre:NOMBRE,localidad:LUGAR,ventas:paraSubir(),consultas:est.consultas}).then(function(d){
      $("resOk").textContent="Confirmar y cargar al sistema"; $("resOk").disabled=false;
      if(!d||!d.ok){$("resNota").textContent=d&&d.error==="sin_ventas"?"No hay ventas para cargar.":d&&d.error==="clave_cierre"?"Clave de cierre incorrecta.":"No se pudo cargar. Probá de nuevo.";return;}
      est.ventas.forEach(function(v){v.sync=true;}); est.consSync=true; persistir(); pintarHoy();
      $("resTabla").innerHTML=tabla(d,true); $("resOk").hidden=true;
      $("resNota").textContent="Listo: quedó cargado el pedido “"+NOMBRE+"” como entregado ("+(Math.round(d.kg*100)/100).toLocaleString("es-AR")+" kg) y se descontó del stock. Te llegó el resumen por mail.";
    }).catch(function(){
      $("resOk").textContent="Confirmar y cargar al sistema"; $("resOk").disabled=false;
      $("resNota").textContent="Sin señal. Las ventas siguen guardadas en el celular; probá cuando tengas conexión.";
    });
  };

  /* ---------- pantalla siempre prendida y funcionamiento sin señal ---------- */
  var wl=null;
  function pedirPantalla(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request("screen").then(function(w){wl=w;w.addEventListener("release",function(){wl=null;});}).catch(function(){});}catch(e){}}
  pedirPantalla();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("/feria-sw.js").catch(function(){});

  pintarCart(); pintarHoy();
  if(!clave) pedirClave(); else subir();
})();
</script>
