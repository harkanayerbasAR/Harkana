<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedí tu Harkana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna para el celular; la tarjeta del pedido es la bolsa de papel kraft, con la franja negra como botón. */
:root{--paper:#DDD3C4;--kraft:#D2A76E;--kraft-light:#E3C18F;--ink:#1F1A15;--muted:#54463A;--thread:#F4EEE3;--danger:#7A1F12;color-scheme:light;
--display:"Cormorant Garamond","Cormorant","Times New Roman",serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.brand{display:block;width:210px;max-width:60%;height:auto;margin:0 auto;mix-blend-mode:multiply}
.hero{display:flex;align-items:center;justify-content:space-between;gap:14px}
.hero>div{min-width:0}
.bag{width:84px;flex:none;filter:drop-shadow(0 6px 8px rgba(31,26,21,.25))}
h1{font-family:var(--display);font-size:2rem;font-weight:600;line-height:1.1;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-size:1.6rem;font-weight:600;margin:0}
.sub{color:var(--muted);margin:0}
.card{position:relative;background:linear-gradient(180deg,var(--kraft-light),var(--kraft) 22%);border-radius:3px;padding:34px 18px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden;box-shadow:0 14px 26px -14px rgba(31,26,21,.55)}
.card::before{content:"";position:absolute;left:0;right:0;top:14px;border-top:3px dashed var(--thread)}
.card>*{min-width:0}
label,.lbl{font-family:var(--display);font-size:.95rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
input[type=text],input[type=tel],textarea{font:500 1rem var(--body);color:var(--ink);background:rgba(255,255,255,.4);border:1.5px solid var(--ink);border-radius:2px;padding:12px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
textarea{resize:vertical;min-height:46px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(31,26,21,.3)}
.qrow:last-child{border-bottom:0}
.qname{font-family:var(--display);font-weight:600;font-size:1.7rem;line-height:1}
.qname small{display:block;font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted);margin-top:3px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 1.4rem var(--body);cursor:pointer}
.step button:active{background:var(--ink);color:var(--kraft)}
.step input{width:62px;text-align:center;font:700 1.2rem var(--body);font-variant-numeric:tabular-nums;color:var(--ink);background:rgba(255,255,255,.4);border:1.5px solid var(--ink);border-radius:2px;padding:10px 4px;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid var(--ink);padding-top:10px}
.total span{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.total b{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.band{margin:4px -18px 0;border-block:2px solid var(--ink);padding-block:4px;background:var(--ink);background-clip:content-box}
.primary{display:block;width:100%;text-align:center;text-decoration:none;font-family:var(--display);font-size:1.45rem;font-weight:600;letter-spacing:.06em;background:transparent;color:var(--kraft-light);border:0;padding:15px;cursor:pointer}
.primary:disabled{opacity:.6}
.foot{padding:0 0 16px;display:flex;flex-direction:column;gap:10px}
.msg{font-size:.95rem;font-weight:700;color:var(--danger)}
.msg:empty{display:none}
.wa{display:block;text-align:center;text-decoration:none;font:700 1rem var(--body);color:var(--ink);border:1.5px solid var(--ink);border-radius:2px;padding:13px}
.contact{text-align:center;color:var(--muted);font-size:.88rem;margin:0}
[hidden]{display:none!important}
</style>
</head>

    var st=el("div","step");
    var m=el("button",null,"−"); m.type="button"; m.setAttribute("aria-label","Restar "+x.n);
    var i=document.createElement("input"); i.type="number"; i.min="0"; i.max="999"; i.inputMode="numeric"; i.value="0"; i.id="in-"+x.k; i.setAttribute("aria-label","Paquetes de "+x.n);
    var p=el("button",null,"+"); p.type="button"; p.setAttribute("aria-label","Sumar "+x.n);
    m.onclick=function(){i.value=Math.max(0,(parseInt(i.value)||0)-1);upd();};
    p.onclick=function(){i.value=Math.min(999,(parseInt(i.value)||0)+1);upd();};
    i.oninput=upd; i.onfocus=function(){i.select();};
    st.appendChild(m);st.appendChild(i);st.appendChild(p); row.appendChild(st); $("qty").appendChild(row);
  });

  /* --- quién es: código del link propio, o datos a mano --- */
  var codigo=(new URLSearchParams(location.search).get("c")||leer("hk_codigo")||"").trim().toUpperCase();
  var nombreFijo="";
  function pedirDatos(){ $("datos").hidden=false; $("comercio").value=leer("hk_comercio"); $("localidad").value=leer("hk_localidad"); $("telefono").value=leer("hk_telefono"); }
  if(codigo&&listo){
    fetch(API+"?cod="+encodeURIComponent(codigo)).then(function(r){return r.json();}).then(function(d){
      if(d&&d.ok){nombreFijo=d.nombre;guardar("hk_codigo",codigo);$("titulo").textContent="Hola, "+d.nombre;}
      else{codigo="";pedirDatos();}
    }).catch(function(){ /* sin conexión: el servidor reconoce el código al enviar */ nombreFijo=leer("hk_nombre");if(!nombreFijo)pedirDatos(); });
  }else{codigo=listo?codigo:"";pedirDatos();}

  function estado(){
    var q={},kg=0;
    PRES.forEach(function(x){q[x.k]=Math.max(0,Math.min(999,parseInt($("in-"+x.k).value)||0));kg+=q[x.k]*x.kg;});
    var com=nombreFijo||$("comercio").value.trim();
    return {q:q,kg:kg,com:com,loc:$("localidad").value.trim(),tel:$("telefono").value.trim(),nota:$("nota").value.trim()};
  }
  function texto(s){
    var l=["*Pedido Harkana*","Comercio: "+s.com]; if(s.loc)l.push("Localidad: "+s.loc);
    PRES.forEach(function(x){if(s.q[x.k]>0)l.push(x.n+": "+s.q[x.k]);});
    l.push("Total: "+fmtKg(s.kg)); if(s.nota)l.push("Nota: "+s.nota); return l.join("\n");
  }
  function upd(){ $("totalKg").textContent=fmtKg(estado().kg); }

  function porWhatsApp(s,motivo){
    $("msg").textContent=motivo;
    $("wa").href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(texto(s));
    $("wa").hidden=false;
  }

  $("enviar").onclick=function(){
    var s=estado(); $("wa").hidden=true;
    if(!s.com){$("msg").textContent="Escribí el nombre de tu comercio.";return;}
    if(s.kg<=0){$("msg").textContent="Sumá al menos un paquete.";return;}
    if(!nombreFijo&&!s.tel){$("msg").textContent="Dejanos un teléfono para confirmarte el pedido.";return;}
    if(!listo){porWhatsApp(s,"Enviá tu pedido por WhatsApp:");return;}
    $("enviar").disabled=true; $("msg").textContent=""; $("enviar").textContent="Enviando…";
    var cuerpo={accion:"pedido",codigo:codigo,comercio:s.com,localidad:s.loc,telefono:s.tel,nota:s.nota};
    PRES.forEach(function(x){cuerpo[x.k]=s.q[x.k];});
    fetch(API,{method:"POST",body:JSON.stringify(cuerpo)}).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok) throw new Error("rechazado");
      if(!nombreFijo){guardar("hk_comercio",s.com);guardar("hk_localidad",s.loc);guardar("hk_telefono",s.tel);} else guardar("hk_nombre",nombreFijo);
      $("resumen").textContent=d.comercio+": "+fmtKg(d.kg)+". Ya nos llegó, te confirmamos la entrega.";
      $("form").hidden=true; $("listo").hidden=false; window.scrollTo(0,0);
    }).catch(function(){
      porWhatsApp(s,"No pudimos enviarlo desde acá. Mandalo por WhatsApp con este botón:");
    }).then(function(){ $("enviar").disabled=false; $("enviar").textContent="Enviar pedido"; });
  };

  $("otro").onclick=function(){
    PRES.forEach(function(x){$("in-"+x.k).value="0";}); $("nota").value=""; upd();
    $("listo").hidden=true; $("form").hidden=false;
  };
  upd();
})();
</script>
</body>
</html>
