<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harkana · Gracias por tu compra</title>
<meta name="description" content="Registrá tu compra de yerba orgánica Harkana y participá del sorteo.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: la página entera es el paquete de yerba; los datos van en un recuadro claro en el centro. */
:root{--paper:#DDD3C4;--kraft:#D2A76E;--kraft-light:#E3C18F;--box:#F6EFE2;--ink:#1F1A15;--muted:#54463A;--thread:#F4EEE3;--danger:#7A1F12;color-scheme:light;
--display:"Cormorant Garamond","Cormorant","Times New Roman",serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{touch-action:manipulation}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:460px;margin:0 auto;padding:10px 12px 20px}
.bag{position:relative;background:linear-gradient(180deg,var(--kraft-light),var(--kraft) 18%);border-radius:3px;padding:26px 18px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden;box-shadow:0 16px 28px -14px rgba(31,26,21,.6)}
.bag::before{content:"";position:absolute;left:0;right:0;top:15px;border-top:3px dashed var(--thread)}
.organica{font-family:var(--display);font-weight:600;font-size:1.25rem;letter-spacing:.2em;text-align:center;text-transform:uppercase;margin:0}
.logo{display:block;width:56%;max-width:230px;height:auto;margin:0 auto;mix-blend-mode:multiply}
.zona{position:relative;margin:0 -18px -18px;padding:10px 18px 60px}
.fondo{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;mix-blend-mode:multiply;opacity:.38;pointer-events:none}
.zona .box{position:relative}
.box{background:rgba(246,239,226,.94);border:1.5px solid var(--ink);border-radius:3px;padding:18px 16px;display:flex;flex-direction:column;gap:13px}
h1{font-family:var(--display);font-size:1.8rem;font-weight:700;line-height:1.05;margin:0;text-align:center;text-wrap:balance}
.sub{color:var(--muted);margin:0;text-align:center}
label{font-family:var(--display);font-size:.95rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
input{font:500 1.05rem var(--body);color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:2px;padding:11px 12px;width:100%;min-width:0}
input::placeholder{color:var(--muted);opacity:.75}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.go{font-family:var(--display);font-size:1.5rem;font-weight:700;letter-spacing:.04em;background:var(--ink);color:var(--kraft-light);border:0;border-radius:2px;padding:15px;cursor:pointer;touch-action:manipulation}
.go:disabled{opacity:.6}
.msg{font-size:.95rem;font-weight:700;color:var(--danger);text-align:center}
.msg:empty{display:none}
.legal{font-size:.78rem;color:var(--muted);text-align:center;margin:0}
.band{position:relative;margin:4px -18px 0;border-block:2px solid var(--ink);padding-block:4px;background:var(--ink);background-clip:content-box}
.band div{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;color:var(--kraft-light);font-family:var(--display);font-weight:600;font-size:1.1rem}
.foot{height:8px}
.ok{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;text-align:center;margin:0}
.show{font-size:1.2rem;font-weight:700;text-align:center;margin:0;text-wrap:balance}
.ticket{border:2px dashed var(--ink);border-radius:3px;padding:12px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.ticket b{display:block;font-family:var(--display);font-size:2.2rem;line-height:1.1}
.otro{font-family:var(--body);font-size:1.02rem;font-weight:700;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:2px;padding:13px;cursor:pointer}
.alt{display:block;text-align:center;color:var(--ink);font-weight:700;padding:6px}
[hidden]{display:none!important}
</style>
</head>

        <div class="field"><label for="nombre">Nombre y apellido</label><input type="text" id="nombre" maxlength="60" autocomplete="name"></div>
        <div class="field" style="margin-top:13px"><label for="localidad">Localidad</label><input type="text" id="localidad" maxlength="40" autocomplete="address-level2"></div>
      </div>
      <button class="go" id="seguir" type="button">Participar</button>
      <div class="msg" id="msg2" role="status"></div>
    </div>

    <div class="box" id="listo" hidden>
      <p class="ok" id="okTit">¡Listo!</p>
      <p class="show" id="okTxt">Ya participás del sorteo.</p>
      <div class="ticket"><b id="num"></b><span>Código de tu compra · Seguinos en @harkanaar para enterarte del ganador</span></div>
    </div>
    </div>
    <div class="band"><div><span>@harkanaar</span><span id="bandTxt">www.harkana.com.ar</span></div></div>
    <div class="foot"></div>
  </div>
</div>

<script>
(function(){
  var API="https://script.google.com/macros/s/AKfycbxsephoJR9xpN11_GrSo15Esxfweiw-aocfFsQXGKjnmzY7LLUZIUtTSXNuac5fCTJiqA/exec";
  var $=function(id){return document.getElementById(id);};
  var qs=new URLSearchParams(location.search);
  var VENTA=(qs.get("v")||"").replace(/[^A-Za-z0-9]/g,"").slice(0,12), ORIGEN=(qs.get("o")||"feria").slice(0,40);
  /* Los mismos datos que guarda la página de muestras: así reconoce a quien ya los dejó en este celular. */
  var leer=function(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}};
  var guardar=function(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}};
  var cuerpoBase={accion:"compra",venta:VENTA,origen:ORIGEN};
  function enviar(c){ return fetch(API,{method:"POST",body:JSON.stringify(c)}).then(function(r){return r.json();}); }
  function ver(id){["paso1","paso2","listo"].forEach(function(p){$(p).hidden=p!==id;}); window.scrollTo(0,0);}
  $("num").textContent=VENTA;

  var pend=leer("hk_c_pend");
  if(pend){ try{ enviar(JSON.parse(pend)).then(function(d){ if(d&&d.ok) guardar("hk_c_pend",null); }).catch(function(){}); }catch(e){ guardar("hk_c_pend",null); } }

  function listo(nombre,txt){
    $("okTit").textContent="¡Listo"+(nombre?", "+nombre:"")+"!";
    $("okTxt").textContent=txt||"Gracias por tu compra. Ya participás del sorteo.";
    ver("listo");
  }
  function recordar(n,c,l){ if(n)guardar("hk_m_nombre",n); if(c)guardar("hk_m_celular",c); if(l)guardar("hk_m_localidad",l); }
  function mandar(c,boton,msg,alNuevo){
    var txt=boton.textContent; boton.disabled=true; boton.textContent="Enviando…"; $(msg).textContent="";
    enviar(c).then(function(d){
      boton.disabled=false; boton.textContent=txt;
      if(d&&d.ok){ guardar("hk_c_hecho_"+VENTA,"1"); listo(d.nombre, d.yaEstaba&&!d.mismo?"Esta compra ya había quedado anotada. ¡Gracias!":null); return; }
      if(d&&d.nuevo){ alNuevo(); return; }
      $(msg).textContent="Revisá los datos y probá de nuevo.";
    }).catch(function(){
      boton.disabled=false; boton.textContent=txt;
      if(c.nombre){ guardar("hk_c_pend",JSON.stringify(c)); listo(c.nombre.split(" ")[0],"No hay señal, pero tus datos quedaron guardados y se envían solos al volver a abrir esta página."); }
      else alNuevo(true);
    });
  }

  if(!VENTA){ ver("paso2"); $("seguir").disabled=true; $("msg2").textContent="Este QR no es válido. Pedí uno nuevo en el stand."; return; }
  if(leer("hk_c_hecho_"+VENTA)){ listo(leer("hk_m_nombre").split(" ")[0],"Esta compra ya está registrada. Ya participás del sorteo."); return; }

  var yoN=leer("hk_m_nombre"), yoC=leer("hk_m_celular");
  if(yoN&&yoC.replace(/\D/g,"").length>=8){ $("hola").textContent="¡Hola "+yoN.split(" ")[0]+"!"; ver("paso1"); }
  else ver("paso2");

  $("siSoy").onclick=function(){
    mandar(Object.assign({},cuerpoBase,{celular:yoC.replace(/\D/g,"")}),$("siSoy"),"msg1",function(){
      var c=Object.assign({},cuerpoBase,{celular:yoC.replace(/\D/g,""),nombre:yoN,localidad:leer("hk_m_localidad")});
      mandar(c,$("siSoy"),"msg1",function(){});
    });
  };
  $("noSoy").onclick=function(){ $("celular").value=""; ver("paso2"); $("celular").focus(); };

  var pideTodo=false;
  $("seguir").onclick=function(){
    var c=$("celular").value.replace(/\D/g,"");
    if(c.length<8){$("msg2").textContent="Revisá el celular: faltan números.";return;}
    if(!pideTodo){
      mandar(Object.assign({},cuerpoBase,{celular:c}),$("seguir"),"msg2",function(){
        pideTodo=true; $("extra").hidden=false; $("msg2").textContent="Es tu primera vez: completá estos dos datos."; $("nombre").focus();
      });
      return;
    }
    var n=$("nombre").value.trim(), l=$("localidad").value.trim();
    if(n.length<3){$("msg2").textContent="Escribí tu nombre y apellido.";return;}
    if(!l){$("msg2").textContent="Decinos de qué localidad sos.";return;}
    recordar(n,$("celular").value.trim(),l);
    mandar(Object.assign({},cuerpoBase,{celular:c,nombre:n,localidad:l}),$("seguir"),"msg2",function(){});
  };
})();
</script>
</body>
</html>
